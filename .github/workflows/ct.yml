name: Continuos Traning
on:
  push:
    branches:
      - ml_experiments

jobs:
  build_cli:
    name: Build CLI for the app
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh
    steps:
      - name: Os Setup
        run: sudo apt update && sudo apt install mold
      - name: Setup rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Build Cli
        run: cargo build --release

      - name: Aquire Data
        run: cargo run --release -- -p

      - name: Train Model on Data
        run: cargo run --release -- -t    
    
    
